[build]
  command = "npx prisma generate && npx prisma migrate deploy && npm run db:seed && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**"
  ]
